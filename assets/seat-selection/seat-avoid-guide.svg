<svg width="1600" height="1040" viewBox="0 0 1600 1040" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="22" x2="1480" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCFEFF"/>
      <stop offset="1" stop-color="#EEF5FD"/>
    </linearGradient>
    <filter id="shadow" x="22" y="22" width="1556" height="996" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#16396F" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="1040" rx="34" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="34" y="34" width="1532" height="972" rx="32" fill="white" fill-opacity="0.92"/>
  </g>
  <rect x="56" y="56" width="400" height="56" rx="18" fill="#1E57A3"/>
  <text x="88" y="92" fill="white" font-size="26" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">三、这些位置，能避就尽量避</text>

  <g>
    <rect x="52" y="132" width="1496" height="846" rx="28" fill="#FCFEFF" stroke="#D9E6F4" stroke-width="2"/>

    <g>
      <circle cx="100" cy="194" r="24" fill="#F05C4D"/>
      <path d="M90 184L110 204" stroke="white" stroke-width="7" stroke-linecap="round"/>
      <path d="M110 184L90 204" stroke="white" stroke-width="7" stroke-linecap="round"/>
      <text x="140" y="202" fill="#173A72" font-size="34" font-family="Source Han Serif SC, Noto Serif SC, serif" font-weight="700">最后一排</text>

      <rect x="104" y="246" width="380" height="250" rx="24" fill="#FFFFFF" stroke="#D6E4F2" stroke-width="2"/>
      <g transform="translate(164 300)">
        <rect x="0" y="0" width="76" height="120" rx="12" fill="#4677BA"/>
        <rect x="86" y="0" width="76" height="120" rx="12" fill="#4677BA"/>
        <rect x="172" y="0" width="76" height="120" rx="12" fill="#4677BA"/>
        <rect x="316" y="-18" width="54" height="128" rx="10" fill="#D8E4F2"/>
        <rect x="334" y="6" width="18" height="20" rx="4" fill="#FFFFFF"/>
        <path d="M-14 30C-4 18 -4 8 -12 -2" stroke="#F16E5F" stroke-width="6" stroke-linecap="round"/>
        <path d="M-2 44C8 32 8 22 0 12" stroke="#F16E5F" stroke-width="6" stroke-linecap="round"/>
      </g>

      <g>
        <circle cx="114" cy="560" r="7" fill="#F05C4D"/>
        <text x="138" y="566" fill="#5E7897" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif">座椅后仰常常更受限，</text>
        <text x="138" y="594" fill="#5E7897" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif">部分机型几乎不能调。</text>
        <circle cx="114" cy="610" r="7" fill="#F05C4D"/>
        <text x="138" y="618" fill="#5E7897" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif">离厕所和后舱人流更近，</text>
        <text x="138" y="646" fill="#5E7897" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif">休息容易被打断。</text>
        <circle cx="114" cy="660" r="7" fill="#F05C4D"/>
        <text x="138" y="668" fill="#5E7897" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif">如果你还容易晕机，</text>
        <text x="138" y="696" fill="#5E7897" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif">后排体感通常也不友好。</text>
      </g>

      <rect x="102" y="718" width="386" height="68" rx="18" fill="#F8FBFF"/>
      <text x="132" y="762" fill="#214F90" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">一句话：短途能忍，长一点就容易后悔。</text>
    </g>

    <line x1="530" y1="162" x2="530" y2="926" stroke="#DDE8F3" stroke-width="2"/>

    <g>
      <circle cx="578" cy="194" r="24" fill="#F05C4D"/>
      <path d="M568 184L588 204" stroke="white" stroke-width="7" stroke-linecap="round"/>
      <path d="M588 184L568 204" stroke="white" stroke-width="7" stroke-linecap="round"/>
      <text x="618" y="202" fill="#173A72" font-size="34" font-family="Source Han Serif SC, Noto Serif SC, serif" font-weight="700">厕所旁边</text>

      <rect x="582" y="246" width="380" height="250" rx="24" fill="#FFFFFF" stroke="#D6E4F2" stroke-width="2"/>
      <g transform="translate(646 304)">
        <rect x="0" y="0" width="62" height="136" rx="10" fill="#D7E3F2"/>
        <rect x="18" y="18" width="20" height="24" rx="4" fill="#FFFFFF"/>
        <path d="M128 14C148 14 160 2 160 -18" stroke="#98BFE5" stroke-width="10" stroke-linecap="round"/>
        <path d="M182 14C202 14 214 2 214 -18" stroke="#98BFE5" stroke-width="10" stroke-linecap="round"/>
        <rect x="150" y="64" width="80" height="110" rx="14" fill="#4677BA"/>
        <circle cx="150" cy="40" r="6" fill="#F05C4D"/>
      </g>

      <g>
        <circle cx="592" cy="560" r="7" fill="#F05C4D"/>
        <text x="616" y="566" fill="#5E7897" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif">异味只是表面问题，</text>
        <text x="616" y="594" fill="#5E7897" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif">真正烦的是排队和开关门。</text>
        <circle cx="592" cy="610" r="7" fill="#F05C4D"/>
        <text x="616" y="618" fill="#5E7897" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif">你刚准备睡、刚想看会儿东西，</text>
        <text x="616" y="646" fill="#5E7897" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif">都可能被打断。</text>
        <circle cx="592" cy="660" r="7" fill="#F05C4D"/>
        <text x="616" y="668" fill="#5E7897" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif">真正让人累的，不是一次噪音，</text>
        <text x="616" y="696" fill="#5E7897" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif">而是整段反复干扰。</text>
      </g>

      <rect x="582" y="718" width="380" height="86" rx="18" fill="#F4FAF7" stroke="#D2E9DB" stroke-width="2"/>
      <circle cx="618" cy="762" r="14" fill="#2FA868"/>
      <path d="M610 762L616 768L626 754" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="646" y="754" fill="#214F90" font-size="21" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">识别方法：看座位图里的厕所标识，</text>
      <text x="646" y="782" fill="#214F90" font-size="21" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">避开紧邻那一排，通常就够了。</text>
    </g>

    <line x1="1050" y1="162" x2="1050" y2="926" stroke="#DDE8F3" stroke-width="2"/>

    <g>
      <circle cx="1098" cy="194" r="24" fill="#F05C4D"/>
      <path d="M1088 184L1108 204" stroke="white" stroke-width="7" stroke-linecap="round"/>
      <path d="M1108 184L1088 204" stroke="white" stroke-width="7" stroke-linecap="round"/>
      <text x="1138" y="202" fill="#173A72" font-size="31" font-family="Source Han Serif SC, Noto Serif SC, serif" font-weight="700">机翼后方（靠窗位）</text>

      <rect x="1102" y="246" width="370" height="250" rx="24" fill="#FFFFFF" stroke="#D6E4F2" stroke-width="2"/>
      <g transform="translate(1164 298)">
        <rect x="0" y="0" width="122" height="150" rx="22" fill="#EEF5FD"/>
        <rect x="34" y="22" width="54" height="106" rx="16" fill="#FFFFFF"/>
        <path d="M48 74H84" stroke="#9CC6E8" stroke-width="8" stroke-linecap="round"/>
        <path d="M44 104L92 70" stroke="#8DBBE4" stroke-width="10" stroke-linecap="round"/>
      </g>

      <g>
        <circle cx="1114" cy="560" r="7" fill="#214F90"/>
        <text x="1138" y="566" fill="#5E7897" font-size="18" font-family="PingFang SC, Microsoft YaHei, sans-serif">不是不能坐，只是不适合想看风景、拍窗外的人。</text>
        <circle cx="1114" cy="610" r="7" fill="#214F90"/>
        <text x="1138" y="618" fill="#5E7897" font-size="18" font-family="PingFang SC, Microsoft YaHei, sans-serif">如果你最期待的是云海、日落、城市夜景，</text>
        <text x="1138" y="644" fill="#5E7897" font-size="18" font-family="PingFang SC, Microsoft YaHei, sans-serif">这类位置常常会失望。</text>
      </g>

      <rect x="1102" y="718" width="370" height="68" rx="18" fill="#F8FBFF"/>
      <text x="1132" y="760" fill="#214F90" font-size="21" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">想拍景：优先机翼前方靠窗。</text>
    </g>
  </g>
</svg>
