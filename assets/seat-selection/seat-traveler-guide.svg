<svg width="1600" height="1040" viewBox="0 0 1600 1040" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="24" x2="1480" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCFEFF"/>
      <stop offset="1" stop-color="#EEF5FD"/>
    </linearGradient>
    <filter id="shadow" x="22" y="22" width="1556" height="996" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#16396F" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="1040" rx="34" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="34" y="34" width="1532" height="972" rx="32" fill="white" fill-opacity="0.92"/>
  </g>
  <rect x="56" y="56" width="404" height="56" rx="18" fill="#1E57A3"/>
  <text x="88" y="92" fill="white" font-size="26" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">五、不同人群，选座建议</text>

  <g>
    <rect x="52" y="132" width="1496" height="846" rx="28" fill="#FCFEFF" stroke="#D9E6F4" stroke-width="2"/>
    <text x="84" y="198" fill="#173A72" font-size="52" font-family="Source Han Serif SC, Noto Serif SC, serif" font-weight="700">如果你懒得一条条判断</text>
    <text x="84" y="254" fill="#173A72" font-size="52" font-family="Source Han Serif SC, Noto Serif SC, serif" font-weight="700">直接按人群选就够了</text>
    <text x="86" y="306" fill="#647E9D" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif">真正好用的建议，一定是分人群的。不同旅客最在意的点不一样，优先级也完全不同。</text>

    <g>
      <rect x="92" y="390" width="680" height="188" rx="24" fill="#FFFFFF" stroke="#D7E5F4" stroke-width="2"/>
      <circle cx="146" cy="484" r="38" fill="#2A5091"/>
      <text x="146" y="496" text-anchor="middle" fill="white" font-size="30" font-family="Source Han Serif SC, Noto Serif SC, serif" font-weight="700">1</text>
      <text x="208" y="458" fill="#173A72" font-size="34" font-family="Source Han Serif SC, Noto Serif SC, serif" font-weight="700">带老人出行</text>
      <text x="208" y="498" fill="#5E7897" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif">优先前中段，重点看平稳和少打扰；</text>
      <text x="208" y="530" fill="#5E7897" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif">如果起身频繁，过道会更方便。</text>
      <rect x="208" y="556" width="400" height="16" rx="8" fill="#EEF5FD"/>
    </g>

    <g>
      <rect x="828" y="390" width="680" height="188" rx="24" fill="#FFFFFF" stroke="#D7E5F4" stroke-width="2"/>
      <circle cx="882" cy="484" r="38" fill="#58A9D6"/>
      <text x="882" y="496" text-anchor="middle" fill="white" font-size="30" font-family="Source Han Serif SC, Noto Serif SC, serif" font-weight="700">2</text>
      <text x="944" y="458" fill="#173A72" font-size="34" font-family="Source Han Serif SC, Noto Serif SC, serif" font-weight="700">第一次坐飞机</text>
      <text x="944" y="498" fill="#5E7897" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif">优先机翼前方靠窗，风景和“第一次飞”的感觉会更完整；</text>
      <text x="944" y="530" fill="#5E7897" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif">如果更怕颠，再往机翼附近收一点。</text>
      <rect x="944" y="556" width="428" height="16" rx="8" fill="#EEF5FD"/>
    </g>

    <g>
      <rect x="92" y="626" width="680" height="188" rx="24" fill="#FFFFFF" stroke="#D7E5F4" stroke-width="2"/>
      <circle cx="146" cy="720" r="38" fill="#17786B"/>
      <text x="146" y="732" text-anchor="middle" fill="white" font-size="30" font-family="Source Han Serif SC, Noto Serif SC, serif" font-weight="700">3</text>
      <text x="208" y="694" fill="#173A72" font-size="34" font-family="Source Han Serif SC, Noto Serif SC, serif" font-weight="700">长途出差</text>
      <text x="208" y="734" fill="#5E7897" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif">优先紧急出口排或过道位；</text>
      <text x="208" y="766" fill="#5E7897" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif">核心不是风景，而是腿和活动自由。</text>
      <rect x="208" y="792" width="370" height="16" rx="8" fill="#EEF5FD"/>
    </g>

    <g>
      <rect x="828" y="626" width="680" height="188" rx="24" fill="#FFFFFF" stroke="#D7E5F4" stroke-width="2"/>
      <circle cx="882" cy="720" r="38" fill="#F0B65D"/>
      <text x="882" y="732" text-anchor="middle" fill="white" font-size="30" font-family="Source Han Serif SC, Noto Serif SC, serif" font-weight="700">4</text>
      <text x="944" y="694" fill="#173A72" font-size="34" font-family="Source Han Serif SC, Noto Serif SC, serif" font-weight="700">容易晕机</text>
      <text x="944" y="734" fill="#5E7897" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif">直接优先机翼附近；如果能靠窗更好，</text>
      <text x="944" y="766" fill="#5E7897" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif">因为你能把视线放远，体感通常更舒服。</text>
      <rect x="944" y="792" width="410" height="16" rx="8" fill="#EEF5FD"/>
    </g>

    <rect x="92" y="858" width="1416" height="76" rx="20" fill="#F6FAFE" stroke="#D9E6F4" stroke-width="2"/>
    <text x="126" y="906" fill="#214F90" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">快速记法：带老人看平稳，第一次坐飞机看体验感，长途出差看腿部空间，容易晕机就守机翼附近。</text>
  </g>
</svg>
