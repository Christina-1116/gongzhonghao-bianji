<svg width="1600" height="1120" viewBox="0 0 1600 1120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="20" x2="1480" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCFEFF"/>
      <stop offset="1" stop-color="#EEF5FD"/>
    </linearGradient>
    <filter id="shadow" x="22" y="22" width="1556" height="1076" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#16396F" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="1120" rx="34" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="34" y="34" width="1532" height="1052" rx="32" fill="white" fill-opacity="0.92"/>
  </g>
  <rect x="56" y="56" width="520" height="56" rx="18" fill="#1E57A3"/>
  <text x="88" y="92" fill="white" font-size="27" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">二、飞机上最好的位置，其实分三类</text>

  <g>
    <rect x="52" y="132" width="1496" height="928" rx="28" fill="#FCFEFF" stroke="#D9E6F4" stroke-width="2"/>

    <g>
      <circle cx="106" cy="196" r="24" fill="#2B59A2"/>
      <path d="M96 196L116 184L110 196L116 208L96 196Z" fill="white"/>
      <text x="142" y="202" fill="#173A72" font-size="34" font-family="Source Han Serif SC, Noto Serif SC, serif" font-weight="700">最稳的位置：机翼附近</text>
      <text x="142" y="242" fill="#5D7695" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">机翼更接近重心区域，</text>
      <text x="142" y="270" fill="#5D7695" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">颠簸时体感通常更柔和。</text>

      <g transform="translate(126 280)">
        <rect x="0" y="0" width="360" height="166" rx="82" fill="#FFFFFF" stroke="#D5E3F2" stroke-width="2"/>
        <rect x="110" y="18" width="140" height="130" rx="30" fill="#FAFCFF" stroke="#D4E2F1" stroke-width="2"/>
        <path d="M-10 82H106" stroke="#D4E4F3" stroke-width="14" stroke-linecap="round"/>
        <path d="M254 82H370" stroke="#D4E4F3" stroke-width="14" stroke-linecap="round"/>
        <g fill="#DCE8F4">
          <rect x="128" y="34" width="18" height="22" rx="4"/>
          <rect x="151" y="34" width="18" height="22" rx="4"/>
          <rect x="174" y="34" width="18" height="22" rx="4"/>
          <rect x="197" y="34" width="18" height="22" rx="4"/>
          <rect x="128" y="63" width="18" height="22" rx="4"/>
          <rect x="151" y="63" width="18" height="22" rx="4"/>
          <rect x="174" y="63" width="18" height="22" rx="4"/>
          <rect x="197" y="63" width="18" height="22" rx="4"/>
          <rect x="128" y="92" width="18" height="22" rx="4"/>
          <rect x="151" y="92" width="18" height="22" rx="4"/>
          <rect x="174" y="92" width="18" height="22" rx="4"/>
          <rect x="197" y="92" width="18" height="22" rx="4"/>
        </g>
        <rect x="130" y="62" width="84" height="24" rx="8" fill="#39A765"/>
      </g>

      <g>
        <circle cx="110" cy="500" r="8" fill="#2F78D0"/>
        <text x="136" y="508" fill="#214F90" font-size="23" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">具体位置</text>
        <text x="136" y="544" fill="#5E7897" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif">看机型，通常在中段，</text>
        <text x="136" y="574" fill="#5E7897" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif">选机翼所在排或前后 1 到 2 排。</text>

        <circle cx="110" cy="640" r="8" fill="#2F78D0"/>
        <text x="136" y="644" fill="#214F90" font-size="23" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">适合人群</text>
        <text x="136" y="680" fill="#5E7897" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif">第一次坐飞机、老人、小孩、</text>
        <text x="136" y="710" fill="#5E7897" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif">容易晕机的旅客。</text>

        <circle cx="110" cy="780" r="8" fill="#2F78D0"/>
        <text x="136" y="776" fill="#214F90" font-size="23" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">缺点</text>
        <text x="136" y="812" fill="#5E7897" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif">靠窗视野会被机翼挡住一部分，</text>
        <text x="136" y="842" fill="#5E7897" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif">拍照和看风景没那么理想。</text>
      </g>
    </g>

    <line x1="530" y1="164" x2="530" y2="1018" stroke="#DDE8F3" stroke-width="2"/>

    <g>
      <circle cx="584" cy="196" r="24" fill="#2B59A2"/>
      <path d="M572 188H582V204H572L562 196L572 188Z" fill="white"/>
      <path d="M596 188H586V204H596L606 196L596 188Z" fill="white"/>
      <text x="620" y="202" fill="#173A72" font-size="34" font-family="Source Han Serif SC, Noto Serif SC, serif" font-weight="700">最安静的位置：前排靠窗</text>
      <text x="620" y="242" fill="#5D7695" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">越靠前通常越安静，</text>
      <text x="620" y="270" fill="#5D7695" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">但要留意婴儿摇篮位。</text>

      <g transform="translate(650 280)">
        <rect x="0" y="0" width="360" height="166" rx="82" fill="#FFFFFF" stroke="#D5E3F2" stroke-width="2"/>
        <rect x="104" y="18" width="152" height="130" rx="30" fill="#FAFCFF" stroke="#D4E2F1" stroke-width="2"/>
        <g fill="#DCE8F4">
          <rect x="124" y="34" width="18" height="22" rx="4"/>
          <rect x="147" y="34" width="18" height="22" rx="4"/>
          <rect x="170" y="34" width="18" height="22" rx="4"/>
          <rect x="193" y="34" width="18" height="22" rx="4"/>
          <rect x="216" y="34" width="18" height="22" rx="4"/>
          <rect x="124" y="63" width="18" height="22" rx="4"/>
          <rect x="147" y="63" width="18" height="22" rx="4"/>
          <rect x="170" y="63" width="18" height="22" rx="4"/>
          <rect x="193" y="63" width="18" height="22" rx="4"/>
          <rect x="216" y="63" width="18" height="22" rx="4"/>
          <rect x="124" y="92" width="18" height="22" rx="4"/>
          <rect x="147" y="92" width="18" height="22" rx="4"/>
          <rect x="170" y="92" width="18" height="22" rx="4"/>
          <rect x="193" y="92" width="18" height="22" rx="4"/>
          <rect x="216" y="92" width="18" height="22" rx="4"/>
        </g>
        <rect x="124" y="34" width="18" height="52" rx="6" fill="#2F78D0"/>
        <rect x="216" y="34" width="18" height="52" rx="6" fill="#2F78D0"/>
        <path d="M-22 76H-8" stroke="#87B8E3" stroke-width="8" stroke-linecap="round"/>
        <path d="M-36 60H-22" stroke="#87B8E3" stroke-width="8" stroke-linecap="round"/>
        <path d="M368 76H382" stroke="#87B8E3" stroke-width="8" stroke-linecap="round"/>
        <path d="M382 60H396" stroke="#87B8E3" stroke-width="8" stroke-linecap="round"/>
      </g>

      <g>
        <circle cx="588" cy="500" r="8" fill="#2F78D0"/>
        <text x="614" y="508" fill="#214F90" font-size="23" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">最佳选择</text>
        <text x="614" y="544" fill="#5E7897" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif">前几排靠窗，适合补觉、看书，</text>
        <text x="614" y="574" fill="#5E7897" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif">也适合第一次坐飞机想要体验感的人。</text>

        <circle cx="588" cy="640" r="8" fill="#2F78D0"/>
        <text x="614" y="642" fill="#214F90" font-size="23" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">提醒</text>
        <text x="614" y="678" fill="#5E7897" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif">如果那排正好是婴儿摇篮位，</text>
        <text x="614" y="708" fill="#5E7897" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif">“最安静”可能会直接反过来。</text>

        <circle cx="588" cy="780" r="8" fill="#2F78D0"/>
        <text x="614" y="776" fill="#214F90" font-size="23" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">一眼判断</text>
        <text x="614" y="812" fill="#5E7897" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif">想安静，就优先靠前；</text>
        <text x="614" y="842" fill="#5E7897" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif">但不要默认第一排一定最好。</text>
      </g>
    </g>

    <line x1="1060" y1="164" x2="1060" y2="1018" stroke="#DDE8F3" stroke-width="2"/>

    <g>
      <circle cx="1114" cy="196" r="24" fill="#2B59A2"/>
      <path d="M1106 178H1122C1128 178 1134 184 1134 190V212H1126L1120 202L1112 212H1106V178Z" fill="white"/>
      <text x="1128" y="192" fill="#173A72" font-size="28" font-family="Source Han Serif SC, Noto Serif SC, serif" font-weight="700">最能伸腿的位置</text>
      <text x="1128" y="226" fill="#173A72" font-size="34" font-family="Source Han Serif SC, Noto Serif SC, serif" font-weight="700">紧急出口排</text>
      <text x="1128" y="258" fill="#5D7695" font-size="18" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">经济舱腿部空间最大，但限制也最多。</text>

      <g transform="translate(1176 280)">
        <rect x="0" y="0" width="310" height="166" rx="82" fill="#FFFFFF" stroke="#D5E3F2" stroke-width="2"/>
        <rect x="90" y="18" width="130" height="130" rx="30" fill="#FAFCFF" stroke="#D4E2F1" stroke-width="2"/>
        <g fill="#DCE8F4">
          <rect x="110" y="34" width="18" height="22" rx="4"/>
          <rect x="133" y="34" width="18" height="22" rx="4"/>
          <rect x="156" y="34" width="18" height="22" rx="4"/>
          <rect x="179" y="34" width="18" height="22" rx="4"/>
          <rect x="110" y="63" width="18" height="22" rx="4"/>
          <rect x="133" y="63" width="18" height="22" rx="4"/>
          <rect x="156" y="63" width="18" height="22" rx="4"/>
          <rect x="179" y="63" width="18" height="22" rx="4"/>
          <rect x="110" y="92" width="18" height="22" rx="4"/>
          <rect x="133" y="92" width="18" height="22" rx="4"/>
          <rect x="156" y="92" width="18" height="22" rx="4"/>
          <rect x="179" y="92" width="18" height="22" rx="4"/>
        </g>
        <rect x="112" y="62" width="86" height="24" rx="8" fill="#39A765"/>
        <path d="M-24 82H-10" stroke="#F16E5F" stroke-width="8" stroke-linecap="round"/>
        <path d="M-38 98L-26 66L-14 98H-38Z" fill="#F16E5F"/>
        <path d="M320 82H334" stroke="#F16E5F" stroke-width="8" stroke-linecap="round"/>
        <path d="M346 98L334 66L322 98H346Z" fill="#F16E5F"/>
      </g>

      <g>
        <circle cx="1118" cy="500" r="8" fill="#2F78D0"/>
        <text x="1128" y="508" fill="#214F90" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">空间有多大</text>
        <text x="1128" y="542" fill="#5E7897" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif">前面更空，腿能伸得更开，</text>
        <text x="1128" y="572" fill="#5E7897" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif">长途飞行会明显更舒服。</text>

        <circle cx="1118" cy="640" r="8" fill="#2F78D0"/>
        <text x="1128" y="640" fill="#214F90" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">限制条件</text>
        <text x="1128" y="674" fill="#5E7897" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif">需要满足安全要求，</text>
        <text x="1128" y="704" fill="#5E7897" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif">部分航司会收费或现场确认。</text>

        <circle cx="1118" cy="780" r="8" fill="#2F78D0"/>
        <text x="1128" y="772" fill="#214F90" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">值不值得选</text>
        <text x="1128" y="806" fill="#5E7897" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif">高个子、长途飞行很值得；</text>
        <text x="1128" y="836" fill="#5E7897" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif">短途飞行意义就没那么大。</text>
      </g>
    </g>
  </g>
</svg>
